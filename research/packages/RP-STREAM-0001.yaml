    evidence_level: E2
    sources: [SRC-000069]
    state: VERIFIED
    context: Official Apache Kafka documentation.
  - claim: Debezium documents change data capture snapshots, offsets and schema changes.
    evidence_level: E2
    sources: [SRC-000070]
    state: VERIFIED
    context: Official Debezium documentation.
  - claim: Apache Flink documents stateful stream processing, event time, checkpoints and processing guarantees.
    evidence_level: E2
    sources: [SRC-000072]
    state: VERIFIED
    context: Official Apache Flink documentation.
cautions: [Exactly-once and ordering claims require end-to-end connector and sink verification.]
