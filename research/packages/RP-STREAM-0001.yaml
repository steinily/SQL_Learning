id: RP-STREAM-0001
topic: M24 streaming CDC and messaging
status: READY
verified_concepts:
  - Streaming systems process unbounded data with explicit event-time, state, checkpoint, partition and delivery semantics.
  - CDC and messaging guarantees depend on source, broker, connector, consumer, sink and failure configuration as one end-to-end path.
claims:
