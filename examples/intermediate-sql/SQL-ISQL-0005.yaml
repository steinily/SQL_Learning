schema_version: 1
id: SQL-ISQL-0005
document_id: DBKB-ISQL-0005
dialect: portable
environment: sqlite-local
setup:
  - |
    CREATE TABLE customer (customer_id INTEGER PRIMARY KEY);
    CREATE TABLE sales_order (order_id INTEGER PRIMARY KEY, customer_id INTEGER);
    INSERT INTO customer VALUES (10), (20), (30);
    INSERT INTO sales_order VALUES (1, 10), (2, 10), (3, 20);
statement: SELECT (SELECT COUNT(*) FROM customer AS c JOIN sales_order AS o ON o.customer_id = c.customer_id), (SELECT COUNT(*) FROM customer AS c WHERE EXISTS (SELECT 1 FROM sales_order AS o WHERE o.customer_id = c.customer_id))
expectation:
  rows: [[3, 2]]
destructive: false
