schema_version: 1
id: SQL-ISQL-0012
document_id: DBKB-ISQL-0012
dialect: portable
environment: sqlite-local
setup:
  - |
    CREATE TABLE product (product_id INTEGER PRIMARY KEY, category_id INTEGER, unit_price INTEGER);
    INSERT INTO product VALUES (1, 10, 10), (2, 10, 30), (3, 20, 5), (4, 20, 7);
statement: SELECT p.product_id FROM product AS p WHERE p.unit_price > (SELECT AVG(p2.unit_price) FROM product AS p2 WHERE p2.category_id = p.category_id) ORDER BY p.product_id
expectation:
  rows: [[2], [4]]
destructive: false
