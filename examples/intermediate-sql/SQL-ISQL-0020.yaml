schema_version: 1
id: SQL-ISQL-0020
document_id: DBKB-ISQL-0020
dialect: portable
environment: sqlite-local
setup:
  - |
    CREATE TABLE order_line (order_id INTEGER, quantity INTEGER, unit_price INTEGER);
    INSERT INTO order_line VALUES (1, 2, 20), (1, 1, 10), (2, 3, 20);
statement: WITH order_totals AS (SELECT order_id, SUM(quantity * unit_price) AS total FROM order_line GROUP BY order_id) SELECT order_id, total FROM order_totals ORDER BY order_id
expectation:
  rows: [[1, 50], [2, 60]]
destructive: false
