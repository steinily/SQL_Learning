schema_version: 1
id: SQL-ASQL-0016
document_id: DBKB-ASQL-0016
dialect: sqlite
environment: sqlite-local
setup:
  - |
    CREATE TABLE node (node_id INTEGER PRIMARY KEY, parent_id INTEGER);
    INSERT INTO node VALUES (1, NULL), (2, 1), (3, 1), (4, 2);
statement: WITH RECURSIVE tree(node_id, depth) AS (SELECT node_id, 0 FROM node WHERE parent_id IS NULL UNION ALL SELECT n.node_id, t.depth + 1 FROM node AS n JOIN tree AS t ON n.parent_id = t.node_id WHERE t.depth < 10) SELECT node_id, depth FROM tree ORDER BY node_id
expectation:
  rows: [[1, 0], [2, 1], [3, 1], [4, 2]]
destructive: false
