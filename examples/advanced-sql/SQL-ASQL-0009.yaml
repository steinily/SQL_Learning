schema_version: 1
id: SQL-ASQL-0009
document_id: DBKB-ASQL-0009
dialect: sqlite
environment: sqlite-local
setup:
  - |
    CREATE TABLE event (event_id INTEGER PRIMARY KEY, sort_key INTEGER, amount INTEGER);
    INSERT INTO event VALUES (1, 1, 10), (2, 1, 20), (3, 2, 5);
statement: SELECT event_id, SUM(amount) OVER (ORDER BY sort_key), SUM(amount) OVER (ORDER BY sort_key, event_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM event ORDER BY event_id
expectation:
  rows: [[1, 30, 10], [2, 30, 30], [3, 35, 35]]
destructive: false
