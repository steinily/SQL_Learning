schema_version: 1
id: SQL-ASQL-0005
document_id: DBKB-ASQL-0005
dialect: sqlite
environment: sqlite-local
setup:
  - |
    CREATE TABLE result (result_id INTEGER PRIMARY KEY, score INTEGER);
    INSERT INTO result VALUES (1, 100), (2, 100), (3, 90);
statement: SELECT result_id, score, RANK() OVER (ORDER BY score DESC), DENSE_RANK() OVER (ORDER BY score DESC), ROW_NUMBER() OVER (ORDER BY score DESC, result_id) FROM result ORDER BY score DESC, result_id
expectation:
  rows: [[1, 100, 1, 1, 1], [2, 100, 1, 1, 2], [3, 90, 3, 2, 3]]
destructive: false
