dialect: portable
environment: sqlite-local
setup:
  - |
    CREATE TABLE sales_order (order_id INTEGER PRIMARY KEY, customer_id INTEGER NOT NULL);
    INSERT INTO sales_order VALUES (1, 10), (2, 10), (3, 20);
statement: SELECT customer_id, COUNT(*) AS order_count FROM sales_order GROUP BY customer_id ORDER BY customer_id
expectation:
  rows:
    - [10, 2]
    - [20, 1]
