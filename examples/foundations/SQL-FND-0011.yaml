schema_version: 1
id: SQL-FND-0011
document_id: DBKB-FND-0022
dialect: portable
environment: sqlite-local
setup:
  - |
    CREATE TABLE customer (customer_id INTEGER PRIMARY KEY, country_code CHAR(2));
    INSERT INTO customer VALUES (1, 'HU'), (2, 'DE'), (3, 'AT');
statement: |
  SELECT
    SUM(CASE WHEN country_code = 'HU' THEN 1 ELSE 0 END) AS matching_rows,
    COUNT(*) AS input_rows
  FROM customer
expectation:
  rows:
    - [1, 3]
destructive: false
