schema_version: 1
id: SQL-FND-0003
document_id: DBKB-FND-0026
dialect: sqlite
environment: sqlite-local
setup:
  - |
    CREATE TABLE account (
      account_id INTEGER PRIMARY KEY,
      balance INTEGER NOT NULL CHECK (balance >= 0)
    );
    INSERT INTO account VALUES (1, 100), (2, 100);
    BEGIN;
    UPDATE account SET balance = balance - 80 WHERE account_id = 1;
statement: UPDATE account SET balance = balance - 180 WHERE account_id = 2
expectation:
  error_class: IntegrityError
  message_contains: CHECK constraint failed
  after_error:
    statement: SELECT account_id, balance FROM account ORDER BY account_id
    rows:
      - [1, 100]
      - [2, 100]
destructive: false
