schema_version: 1
id: SQL-TX-0003
document_id: DBKB-TX-0003
dialect: sqlite
environment: sqlite-local
setup:
  - |
    CREATE TABLE account (account_id INTEGER PRIMARY KEY, balance INTEGER NOT NULL);
    INSERT INTO account VALUES (1, 100);
    BEGIN;
    UPDATE account SET balance = balance + 25 WHERE account_id = 1;
    COMMIT;
    BEGIN;
    UPDATE account SET balance = balance + 1000 WHERE account_id = 1;
    ROLLBACK;
statement: SELECT account_id, balance FROM account
expectation:
  rows: [[1, 125]]
destructive: false
